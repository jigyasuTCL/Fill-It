		google()
		mavenCentral()
		maven {
			url "https://artifactory.boombit.com/artifactory/libs-release"
		}
		**ARTIFACTORYREPOSITORY**
	}
}

include ':launcher', ':unityLibrary'
include 'unityLibrary:Coredian.androidlib:unity-classes'
