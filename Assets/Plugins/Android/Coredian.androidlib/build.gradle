apply plugin: 'com.android.library'

dependencies {
	compileOnly project('unity-classes')
	implementation fileTree(dir: 'bin', include: ['*.jar'])
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation fileTree(dir: '../libs', include: ['*.jar'])
	implementation 'com.boombit:firebase-crashlytics:1.1.5.0'
	implementation 'com.coredian.privacy:core-usercentrics:2.28.0.0'
	implementation 'com.coredian:core-common:1.15.10.0'
	implementation 'com.android.support:multidex:1.0.3'
}

android {
	namespace "com.coredian.androidlib"
	compileSdk 36
	// Pinned to the only build-tools Unity ships with its bundled SDK (36.0.0). Without it AGP
	// 8.10 falls back to its own default of 35.0.0, which is not installed - and the SDK lives
	// under Program Files, so Gradle cannot install it or accept its licence either. The launcher
	// and unityLibrary modules never hit this because Unity substitutes **BUILDTOOLS** into their
	// templates; this module is hand-written and was not covered.
	buildToolsVersion '36.0.0'
	
	defaultConfig {
		minSdk 26
		targetSdk 36
	}
	
	lint {
		abortOnError false
	}
	
	sourceSets {
		main {
			manifest.srcFile 'AndroidManifest.xml'
			java.srcDirs = ['src']
			res.srcDirs = ['res']
			assets.srcDirs = ['assets']
			jniLibs.srcDirs = ['libs']
		}
	}
}
